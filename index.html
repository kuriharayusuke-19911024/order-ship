<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注文・発送管理｜栗原の丹波栗</title>
<meta name="theme-color" content="#5a3a1c">
<style>
:root{
  --paper:#f4f3ee; --card:#ffffff; --ink:#22201b; --sub:#6d685e; --line:#dedad0;
  --kuri:#6b4423; --kuri-2:#8a5a2b;
  --s1:#8b95a3; --s2:#d9861c; --s3:#3f8f4a; --s4:#2f6fb0; --s5:#5a3a1c;
  --danger:#b93a2e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--kuri-2)}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--kuri);color:#fff;padding:10px 14px 8px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.top .row{display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.02em}
.top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;max-width:150px}
.top select option{color:var(--ink)}
.sync{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.ok{background:#7fd88a}.dot.ng{background:#ff9b8e}.dot.busy{background:#ffd76a}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.chip b{margin-left:4px;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tools{display:flex;gap:8px;padding:6px 14px 4px;align-items:center}
.tools input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.tools select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--card);font-size:13.5px}

/* list */
.list{padding:8px 14px 100px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;cursor:pointer}
.card.mine{border-left:4px solid var(--kuri-2)}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .cust{font-weight:700;font-size:16px}
.card .date{color:var(--sub);font-size:12.5px;white-space:nowrap}
.card .items{font-size:14px;margin:4px 0 2px}
.card .meta{color:var(--sub);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card .meta .late{color:var(--danger);font-weight:700}
.card .clip{font-size:12px;color:var(--sub)}
.steps{display:flex;gap:3px;margin:9px 0 6px}
.steps i{flex:1;height:6px;border-radius:3px;background:#e6e2d8}
.steps i.done{background:var(--c)}
.stline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stname{font-size:13px;font-weight:700;color:var(--c)}
.next{border:0;background:var(--c);color:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:700}
.next:disabled{background:#cfcac0}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--kuri-2);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(80,50,20,.35);z-index:4}

/* sheet / modal */
.sheet{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--paper);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .inner{border-radius:16px;max-height:90vh}}
.sheet .bar{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--line);z-index:1}
.sheet .bar h2{margin:0;font-size:17px}
.x{border:0;background:none;font-size:24px;line-height:1;padding:2px 6px;color:var(--sub)}
.body{padding:12px 16px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.irow{display:grid;grid-template-columns:1fr 62px 52px 84px 46px 28px;gap:4px;margin-bottom:6px;align-items:center}
.irow input,.irow select{padding:8px 6px;font-size:14px}
.irow select{border:1px solid var(--line);border-radius:8px;background:#fff}
.ihead{display:grid;grid-template-columns:1fr 62px 52px 84px 46px 28px;gap:4px;font-size:11px;color:var(--sub);padding:0 4px 2px}
.subtot{text-align:right;font-size:13px;color:var(--sub);margin:2px 0 4px}
.subtot b{color:var(--ink);font-size:15px}
.docline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.docline a{font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.chk input{width:18px;height:18px}
.inv-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.inv-row .n{flex:1}
.inv-row .n b{display:block;font-size:15px}
.inv-row .n span{font-size:12.5px;color:var(--sub)}
.inv-row .amt{font-weight:700;white-space:nowrap}
.shiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shiprow select{width:auto;flex:1;min-width:90px}
.shipout{font-size:13px;color:var(--sub);flex-basis:100%}
.irow input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 8px;background:#fff}
.irow button{border:0;background:none;color:var(--sub);font-size:20px}
.add{border:1px dashed var(--kuri-2);color:var(--kuri-2);background:none;border-radius:8px;padding:7px 12px;font-size:13.5px;width:100%}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.file label.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.file input[type=file]{display:none}
.thumb{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:8px}
.filename{font-size:13px;color:var(--sub)}
.btns{display:flex;gap:8px;margin-top:6px}
.primary{flex:1;border:0;background:var(--kuri-2);color:#fff;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 16px;font-size:15px}
.ghost.danger{color:var(--danger);border-color:#e8c2bd}

/* detail */
.dl{display:grid;grid-template-columns:5.5em 1fr;gap:6px 8px;font-size:14.5px}
.dl b{color:var(--sub);font-weight:600;font-size:13px;padding-top:2px}
.dl ul{margin:0;padding-left:18px}
.stbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.stbox .now{font-size:13px;color:var(--sub)}
.stbox .big{font-size:22px;font-weight:700;color:var(--c);margin:2px 0 8px}
.stbtns{display:flex;gap:8px}
.stbtns .next{flex:1;padding:12px;font-size:15px}
.stbtns .back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;font-size:14px;color:var(--sub)}
.hist{font-size:12.5px;color:var(--sub);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hist div{margin:2px 0}
.confirm{background:#fff5f3;border:1px solid #e8c2bd;border-radius:10px;padding:12px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
.notice{margin:8px 14px 0;background:#fff6dd;border:1px solid #ecd48c;border-radius:10px;padding:8px 12px;font-size:13px}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <h1>注文・発送管理</h1>
    <select id="me" title="自分の名前"></select>
  </div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncmsg">読み込み中…</span></div>
</header>

<div class="notice" id="noapi" hidden>API_URLが未設定のため、この端末だけに保存されています。共有するにはGASのURLを設定してください。</div>

<div class="chips" id="chips"></div>
<div class="tools">
  <input id="q" type="search" placeholder="注文元・商品・発送先で検索">
  <select id="sort"><option value="due">納期順</option><option value="new">新しい順</option></select>
  <button class="ghost" id="openInv" style="padding:7px 10px;font-size:13.5px;white-space:nowrap">請求書</button>
</div>
<div class="list" id="list"></div>

<button class="fab" id="fab">＋ 注文を登録</button>

<!-- 登録・編集 -->
<div class="sheet" id="form" hidden>
  <div class="inner">
    <div class="bar"><h2 id="formTitle">注文を登録</h2><button class="x" data-close="form">×</button></div>
    <div class="body">
      <input type="hidden" id="fId">
      <div class="f2">
        <div class="f"><label>注文日</label><input type="date" id="fDate"></div>
        <div class="f"><label>納期（発送希望日）</label><input type="date" id="fDue"></div>
      </div>
      <div class="f"><label>注文元（お客様・取引先）</label><input id="fCust" list="custList" placeholder="例：藤代商店" autocomplete="off"><datalist id="custList"></datalist></div>
      <div class="f"><label>商品・数量・単価（税抜）</label>
        <div class="ihead"><span>商品名</span><span>数量</span><span>単位</span><span>単価</span><span>税率</span><span></span></div>
        <div id="items"></div>
        <div class="subtot" id="subtot"></div>
        <button class="add" id="addItem">＋ 商品を追加</button>
        <datalist id="prodList"></datalist>
      </div>
      <div class="f"><label>発送先（名前）</label><input id="fShipTo" placeholder="注文元と同じなら空欄でOK"></div>
      <div class="f"><label>発送先住所・電話</label><textarea id="fAddr" placeholder="住所、電話番号、時間指定など"></textarea></div>
      <div class="f"><label>送料（住所から都道府県を判定して自動計算・税抜＋加算）</label>
        <div class="shiprow">
          <select id="fShipType"><option value="">送料なし</option><option value="常温">常温</option><option value="冷蔵">クール冷蔵</option><option value="冷凍">クール冷凍</option></select>
          <select id="fSize"></select>
          <select id="fPref"></select>
          <span class="shipout" id="shipOut"></span>
        </div>
      </div>
      <div class="f2">
        <div class="f"><label>発送の担当者</label><select id="fAssignee"></select></div>
        <div class="f"><label>ステータス</label><select id="fStatus"></select></div>
      </div>
      <div class="f2">
        <div class="f"><label>発送日（納品書の日付）</label><input type="date" id="fShipDate"></div>
        <div class="f"><label>納品書</label><label class="chk" style="margin-top:8px"><input type="checkbox" id="fShowPrice" checked> 金額を載せる</label></div>
      </div>
      <div class="f"><label>メモ・伝えたいこと</label><textarea id="fMemo" placeholder="例：熨斗あり／クール便で"></textarea></div>
      <div class="f"><label>メールで来た注文はここに本文を貼る</label>
        <textarea id="fMail" placeholder="注文メールの本文をコピーして貼り付け → 「読み取る」" style="min-height:60px"></textarea>
        <button class="add" id="readMail" type="button" style="margin-top:6px">✉ メール本文を読み取る</button>
      </div>
      <div class="f"><label>注文書（写真・PDF）</label>
        <div class="file">
          <label class="btn">📷 撮影する<input type="file" id="fCam" accept="image/*" capture="environment"></label>
          <label class="btn">📎 ファイルを選ぶ<input type="file" id="fFile" accept="image/*,application/pdf"></label>
          <span class="filename" id="fileName"></span>
        </div>
        <img class="thumb" id="fThumb" hidden alt="">
      </div>
      <div class="btns">
        <button class="primary" id="save">保存する</button>
      </div>
    </div>
  </div>
</div>

<!-- 詳細 -->
<div class="sheet" id="detail" hidden>
  <div class="inner">
    <div class="bar"><h2 id="dTitle"></h2><button class="x" data-close="detail">×</button></div>
    <div class="body" id="dBody"></div>
  </div>
</div>

<!-- 月末請求 -->
<div class="sheet" id="inv" hidden>
  <div class="inner">
    <div class="bar"><h2>請求書をまとめて作る</h2><button class="x" data-close="inv">×</button></div>
    <div class="body">
      <div class="f"><label>対象月（発送日で絞り込み）</label><div style="display:flex;gap:8px;align-items:center"><input type="month" id="invMonth" style="flex:1"><label style="display:flex;align-items:center;gap:4px;font-size:13.5px;white-space:nowrap"><input type="checkbox" id="invAll">全期間</label></div></div>
      <div class="f"><div style="font-size:13.5px;color:var(--sub)">選んだ月に発送した「発送済」で未請求の注文を、注文元ごとにまとめて1枚の請求書にします。作成後は「請求済」になります。</div></div>
      <div id="invList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script>
// ===== 設定 =====
const API_URL = 'https://script.google.com/macros/s/AKfycbygQB1AB_PSgpIQM1Kzf_hxN8vwmDmEbMqwM_GGr8GuQCfUEFqDhenZLnGC2JuMDg5V/exec'; // ← GASのウェブアプリURLを貼る（空ならこの端末だけに保存）
const MEMBERS = ['栗原直人','栗原優介','秋山龍之輔','栗原亜美','木村みき','栗原美智代','松本琉雅'];
const STATUS = ['受注','発送依頼','発送済','請求済','入金済'];
const SCOLOR = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
const STEP_LABEL = ['発送を依頼する','発送した','請求した','入金を確認した'];

// ===== 状態 =====
let orders = JSON.parse(localStorage.getItem('orders')||'[]');
let pending = JSON.parse(localStorage.getItem('pending')||'[]');
let me = localStorage.getItem('me')||'';
let filter = 'all', pendingFile = null;
let master = JSON.parse(localStorage.getItem('master')||'{"settings":{},"products":[],"ship":[]}');
const ZONES = ['南九州','北九州','四国','中国','関西','北陸','東海','信越','関東','南東北','北東北','北海道'];
const PREF_ZONE = {'熊本':0,'宮崎':0,'鹿児島':0,'福岡':1,'佐賀':1,'長崎':1,'大分':1,'徳島':2,'香川':2,'愛媛':2,'高知':2,'鳥取':3,'島根':3,'岡山':3,'広島':3,'山口':3,'滋賀':4,'京都':4,'大阪':4,'兵庫':4,'奈良':4,'和歌山':4,'富山':5,'石川':5,'福井':5,'岐阜':6,'静岡':6,'愛知':6,'三重':6,'新潟':7,'長野':7,'茨城':8,'栃木':8,'群馬':8,'埼玉':8,'千葉':8,'東京':8,'神奈川':8,'山梨':8,'宮城':9,'山形':9,'福島':9,'青森':10,'岩手':10,'秋田':10,'北海道':11,'沖縄':-1};
const PREFS = Object.keys(PREF_ZONE);
function detectPref(text){ const t=String(text||''); let best=null,pos=1e9; PREFS.forEach(p=>{ const i=t.indexOf(p); if(i>=0 && i<pos){ pos=i; best=p; } }); return best; }
function shipFee(type,size,pref){
  const ship=master.ship||[]; if(!type||!pref||!(pref in PREF_ZONE)) return null;
  const z=PREF_ZONE[pref]; if(z<0) return {err:'沖縄は別途料金'};
  const base=ship.find(r=>r.type===(type==='常温'?'常温':'クール') && r.size===Number(size)); if(!base) return {err:'該当サイズなし'};
  let fee=base.rates[z]||0; let cool=0;
  if(type!=='常温'){ const c=ship.filter(r=>r.type==='クール加算').sort((a,b)=>a.kg-b.kg).find(r=>r.kg>=base.kg); cool=c?c.rates[0]:0; }
  const add=Number((master.settings||{})['送料加算'])||0;
  return {fee:fee+cool+add, base:fee, cool, add, zone:ZONES[z]};
}
function sizesFor(type){ return [...new Set((master.ship||[]).filter(r=>r.type===(type==='常温'?'常温':'クール')).map(r=>r.size))].sort((a,b)=>a-b); }
const yen = n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
function calcItems(items){
  const byTax={}; let sub=0;
  (items||[]).forEach(i=>{ const a=(Number(i.qty)||0)*(Number(i.price)||0); const t=(i.tax===''||i.tax==null)?8:Number(i.tax); sub+=a; byTax[t]=(byTax[t]||0)+a; });
  const tax=Object.keys(byTax).reduce((a,t)=>a+Math.floor(byTax[t]*(+t)/100),0);
  return {sub,tax,total:sub+tax};
}
async function loadMaster(){
  if(!API_URL) return;
  try{ const r=await fetch(API_URL+'?action=master&t='+Date.now()); const j=await r.json(); if(j.products){ master=j; localStorage.setItem('master',JSON.stringify(master)); renderProdList(); if(!$('form').hidden) fillShipUI(); } }catch(e){ console.error(e); }
}
function renderProdList(){
  const names=new Set(master.products.map(p=>p.name));
  orders.forEach(o=>(o.items||[]).forEach(i=>{ if(i.name) names.add(i.name); }));
  $('prodList').innerHTML=[...names].map(c=>`<option value="${esc(c)}">`).join('');
}

const $ = id=>document.getElementById(id);
function fillShipUI(){
  const type=$('fShipType').value; const cur=$('fSize').value;
  const sizes=type?sizesFor(type):[];
  $('fSize').innerHTML=sizes.map(z=>`<option value="${z}" ${String(z)===cur?'selected':''}>${z}サイズ</option>`).join('')||'<option value="">—</option>';
  if(!$('fPref').options.length) $('fPref').innerHTML='<option value="">都道府県</option>'+PREFS.map(p=>`<option value="${p}">${p}</option>`).join('');
  $('fSize').disabled=!type; $('fPref').disabled=!type;
}
function upsertShipItem(){
  const type=$('fShipType').value, size=$('fSize').value, pref=$('fPref').value;
  const rows=[...$('items').children]; const shipRow=rows.find(r=>r.querySelector('input').value.trim()==='送料');
  if(!type){ $('shipOut').textContent=''; return; }
  const r=shipFee(type,size,pref);
  if(!r||r.err){ $('shipOut').textContent=r?r.err:'都道府県を選んでください'; return; }
  $('shipOut').textContent=`${r.zone}：運賃 ${yen(r.base)}${r.cool?` ＋クール ${yen(r.cool)}`:''} ＋加算 ${yen(r.add)} ＝ 送料 ${yen(r.fee)}（税抜・10%）`;
  const it={name:'送料',qty:1,unit:'式',price:r.fee,tax:10};
  if(shipRow){ const [n,q,u,p]=shipRow.querySelectorAll('input'); q.value=1; u.value='式'; p.value=r.fee; shipRow.querySelector('select').value='10'; }
  else { const empty=rows.find(x=>!x.querySelector('input').value.trim()); const el=itemRow(it); if(empty) $('items').replaceChild(el,empty); else $('items').appendChild(el); }
  updSub();
}
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmt = s=>s? s.replace(/^(\d{4})-(\d{2})-(\d{2}).*/,(m,y,mo,d)=>`${+mo}/${+d}`):'—';
const now = ()=>new Date().toISOString();
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
let toastT; function toast(m){ $('toast').textContent=m; $('toast').hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>$('toast').hidden=true,2200); }

// ===== 同期（GAS） =====
async function api(body){
  const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  const j = await r.json(); if(j.error) throw new Error(j.error); return j;
}
async function pull(){
  if(!API_URL){ $('noapi').hidden=false; setSync('','この端末のみ'); return; }
  setSync('busy','同期中…');
  try{
    const r = await fetch(API_URL+'?action=list&t='+Date.now()); const j = await r.json();
    const map = new Map(orders.map(o=>[o.id,o]));
    (j.orders||[]).forEach(ro=>{ const lo=map.get(ro.id); if(!lo || (ro.updatedAt>lo.updatedAt && !pending.includes(ro.id))) map.set(ro.id,ro); });
    orders=[...map.values()]; persist(); render();
    await pushPending();
    setSync('ok','同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ console.error(e); setSync('ng','同期できません（オフライン？）'); }
}
async function pushPending(){
  if(!API_URL) return;
  for(const id of [...pending]){
    const o = orders.find(x=>x.id===id); if(!o){ pending=pending.filter(x=>x!==id); continue; }
    try{ await api({action:'save',order:o}); pending=pending.filter(x=>x!==id); persist(); }
    catch(e){ console.error(e); setSync('ng','送信待ちあり（あとで再送します）'); return; }
  }
}
function saveOrder(o){
  o.updatedAt = now();
  const i = orders.findIndex(x=>x.id===o.id); if(i>=0) orders[i]=o; else orders.unshift(o);
  if(!pending.includes(o.id)) pending.push(o.id);
  persist(); render(); pushPending().then(()=>{ if(API_URL && !pending.length) setSync('ok','同期済み'); });
}

function visible(){ return orders.filter(o=>!o.deleted); }
function render(){
  const vis = visible();
  const counts = {all:vis.length, mine:vis.filter(o=>o.assignee===me && o.status!=='入金済').length};
  STATUS.forEach(s=>counts[s]=vis.filter(o=>o.status===s).length);
  const chips = [['all','すべて'],['mine','自分の担当'],...STATUS.map(s=>[s,s])];
  $('chips').innerHTML = chips.map(([k,l])=>`<button class="chip ${filter===k?'on':''}" data-k="${k}">${l}<b>${counts[k]}</b></button>`).join('');
  const q = $('q').value.trim();
  let list = vis.filter(o=> filter==='all' ? true : filter==='mine' ? (o.assignee===me && o.status!=='入金済') : o.status===filter);
  if(q) list = list.filter(o=>[o.customer,o.shipTo,o.memo,(o.items||[]).map(i=>i.name).join(' ')].join(' ').includes(q));
  const sort = $('sort').value;
  list.sort((a,b)=> sort==='new' ? (b.updatedAt>a.updatedAt?1:-1) : ((a.due||'9')+a.orderDate).localeCompare((b.due||'9')+b.orderDate));
  if(filter==='all') list.sort((a,b)=> (a.status==='入金済')-(b.status==='入金済'));
  $('list').innerHTML = list.length ? list.map(card).join('') : `<div class="empty">${q?'該当する注文はありません':'注文はまだありません。右下の「＋ 注文を登録」から追加できます。'}</div>`;
  // datalists
  $('custList').innerHTML=[...new Set(orders.map(o=>o.customer).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
  renderProdList();
}
function itemsText(o){ return (o.items||[]).map(i=>`${i.name}${i.qty?` ×${i.qty}${i.unit||''}`:''}`).join('、')||'（商品未入力）'; }
function orderTotal(o){ const c=calcItems(o.items); return c.sub? yen(c.total)+'（税込）' : ''; }
function card(o){
  const si = STATUS.indexOf(o.status), c=SCOLOR[si];
  const late = o.due && o.due<today() && si<2;
  return `<div class="card ${o.assignee===me?'mine':''}" data-id="${o.id}" style="--c:${c}">
    <div class="h"><span class="cust">${esc(o.customer||'（注文元未入力）')}</span><span class="date">注文 ${fmt(o.orderDate)}</span></div>
    <div class="items">${esc(itemsText(o))}</div>
    <div class="meta"><span class="${late?'late':''}">納期 ${fmt(o.due)}${late?'（遅れ）':''}</span><span>担当 ${esc(o.assignee||'未定')}</span>${o.shipTo?`<span>宛先 ${esc(o.shipTo)}</span>`:''}${orderTotal(o)?`<span>${orderTotal(o)}</span>`:''}${o.fileUrl||o.fileData?`<span class="clip">📎 注文書</span>`:''}${o.deliveryUrl?`<span class="clip">📄 納品書</span>`:''}${o.invoiceUrl?`<span class="clip">🧾 請求書</span>`:''}</div>
    <div class="steps">${STATUS.map((s,i)=>`<i class="${i<=si?'done':''}"></i>`).join('')}</div>
    <div class="stline"><span class="stname">${esc(o.status)}</span>${si<4?`<button class="next" data-next="${o.id}">${STEP_LABEL[si]}</button>`:'<span class="stname">完了</span>'}</div>

}
$('chips').onclick=e=>{const b=e.target.closest('.chip'); if(b){filter=b.dataset.k; render();}};
$('q').oninput=render; $('sort').onchange=render;
$('list').onclick=e=>{
  const nb=e.target.closest('[data-next]'); if(nb){ e.stopPropagation(); advance(nb.dataset.next,1); return; }
  const c=e.target.closest('.card'); if(c) openDetail(c.dataset.id);
};
function advance(id,dir){
  if(!me){ toast('先に右上で自分の名前を選んでください'); return; }
  const o=orders.find(x=>x.id===id); const i=STATUS.indexOf(o.status)+dir; if(i<0||i>=STATUS.length) return;
  o.status=STATUS[i]; (o.history=o.history||[]).push({at:now(),by:me,to:o.status});
  if(dir>0 && o.status==='発送済' && !o.shipDate) o.shipDate=today();
  saveOrder(o); toast(`「${o.status}」にしました`);
  if(dir>0 && o.status==='発送依頼'){ notifyLine(o); makeDelivery(o); }
  if(!$('detail').hidden) openDetail(id);
}
async function makeDelivery(o, force){
  if(!API_URL) return;
  if(!(o.items||[]).length) return;
  try{
    const r=await api({action:'delivery',order:o});
    o.deliveryUrl=r.url; o.deliveryNo=r.no; saveOrder(o);
    toast('納品書を作成しました'); if(!$('detail').hidden) openDetail(o.id);
  }catch(err){ console.error(err); toast('納品書を作成できませんでした：'+err.message); }
}
async function makeInvoiceFor(list){
  if(!API_URL||!list.length) return;
  try{
    const r=await api({action:'invoice',orders:list});
    list.forEach(o=>{ o.invoiceUrl=r.url; o.invoiceNo=r.no; if(STATUS.indexOf(o.status)<3){ o.status='請求済'; (o.history=o.history||[]).push({at:now(),by:me||'（名前未設定）',to:'請求済'}); } saveOrder(o); });
    toast(`請求書 ${r.no} を作成（${yen(r.total)}）`);
    return r;
  }catch(err){ console.error(err); toast('請求書を作成できませんでした：'+err.message); }
}
async function notifyLine(o){
  if(!API_URL || !o.assignee) return;
  try{ const r=await api({action:'notify',order:o,by:me}); toast(r.skipped ? '通知なし：'+r.skipped : `${o.assignee}さんにLINEで通知しました`); }
  catch(err){ console.error(err); toast('LINE通知できませんでした：'+err.message); }
}

async function fileToData(file){
  if(file.type.startsWith('image/')){
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const max=1600, r=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return {data:cv.toDataURL('image/jpeg',.82), type:'image/jpeg', name:file.name.replace(/\.\w+$/,'')+'.jpg'};
  }
  if(file.size>8*1024*1024) throw new Error('ファイルが大きすぎます（8MBまで）');
  const data = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  return {data, type:file.type, name:file.name};
}
async function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  try{ pendingFile=await fileToData(f); $('fileName').textContent=pendingFile.name; if(pendingFile.type.startsWith('image')){ $('fThumb').src=pendingFile.data; $('fThumb').hidden=false; } else $('fThumb').hidden=true; }
  catch(err){ toast(err.message); }
  e.target.value='';
  if(pendingFile && API_URL) readOrder();
}
function applyRead(d){
  const set=(id,v)=>{ if(v && !$(id).value) $(id).value=v; };
  set('fDate',d.orderDate); set('fDue',d.due); set('fCust',d.customer); set('fShipTo',d.shipTo); set('fAddr',d.addr); set('fMemo',d.memo);
  const pf=detectPref($('fAddr').value); if(pf){ $('fPref').value=pf; upsertShipItem(); }
  const cur=[...$('items').children].some(r=>r.querySelector('input').value.trim());
  if(!cur && Array.isArray(d.items) && d.items.length){ $('items').innerHTML=''; d.items.forEach(it=>{ const m=master.products.find(x=>x.name===String(it.name||'').trim()); if(m){ it.price=it.price||m.price; it.unit=it.unit||m.unit; it.tax=m.tax; } $('items').appendChild(itemRow(it)); }); updSub(); }
}

$('save').onclick=async()=>{
  const cust=$('fCust').value.trim(); if(!cust){ toast('注文元を入力してください'); $('fCust').focus(); return; }
  const items=readItems();
  if(!items.length){ toast('商品を1つ以上入力してください'); return; }
  const id=$('fId').value; const old=orders.find(x=>x.id===id);
  const o = Object.assign({}, old||{id:uid(),createdAt:now(),createdBy:me,history:[]}, {
    orderDate:$('fDate').value, due:$('fDue').value, customer:cust, items, shipTo:$('fShipTo').value.trim(), addr:$('fAddr').value.trim(),
    assignee:$('fAssignee').value, status:$('fStatus').value, memo:$('fMemo').value.trim(),
    shipDate:$('fShipDate').value, showPrice:$('fShowPrice').checked,
    shipType:$('fShipType').value, size:$('fSize').value, pref:$('fPref').value
  });
  if(!old) o.history.push({at:now(),by:me||'（名前未設定）',to:o.status+'（登録）'});
  else if(old.status!==o.status) o.history.push({at:now(),by:me||'（名前未設定）',to:o.status});
  $('save').disabled=true; $('save').textContent='保存中…';
  try{
    if(pendingFile){
      if(API_URL){ const r=await api({action:'upload',id:o.id,name:pendingFile.name,type:pendingFile.type,data:pendingFile.data.split(',')[1]}); o.fileUrl=r.url; o.fileId=r.id; delete o.fileData; }
      else { o.fileData=pendingFile.data; o.fileUrl=''; }
      o.fileName=pendingFile.name; o.fileType=pendingFile.type;
    }
    saveOrder(o); $('form').hidden=true; toast(old?'保存しました':'注文を登録しました');
    if(o.status==='発送依頼' && (!old || old.status!=='発送依頼' || old.assignee!==o.assignee)) notifyLine(o);
  }catch(err){ console.error(err); toast('保存に失敗：'+err.message); }
  $('save').disabled=false; $('save').textContent='保存する';
};

$('openInv').onclick=()=>{ if(!$('invMonth').value){ const d=new Date(); $('invMonth').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); } renderInv(); $('inv').hidden=false; };
$('invMonth').addEventListener('change',renderInv); $('invAll').addEventListener('change',renderInv);
function renderInv(){
  const ym=$('invMonth').value, all=$('invAll').checked;
  const targets=visible().filter(o=>o.status==='発送済' && !o.invoiceUrl && (all || !ym || String(o.shipDate||o.due||'').slice(0,7)===ym));
  const groups={}; targets.forEach(o=>{ (groups[o.customer]=groups[o.customer]||[]).push(o); });
  const keys=Object.keys(groups).sort();
  $('invList').innerHTML = keys.length ? keys.map(k=>{
    const list=groups[k]; const total=list.reduce((a,o)=>a+calcItems(o.items).total,0);
    const noPrice=list.some(o=>!calcItems(o.items).sub);
    return `<div class="inv-row"><div class="n"><b>${esc(k)}</b><span>${list.length}件：${list.map(o=>fmt(o.shipDate||o.due)).join('、')}${noPrice?'　<span style="color:var(--danger)">単価未入力あり</span>':''}</span></div><div class="amt">${yen(total)}</div><button class="next" style="--c:var(--s4)" data-inv="${esc(k)}" ${noPrice?'disabled':''}>作成</button></div>`;
  }).join('') : `<div class="empty">${all?'':(ym?ym.replace('-','年')+'月に発送した':'')}「発送済」で未請求の注文はありません</div>`;
  $('invList').querySelectorAll('[data-inv]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='作成中…'; const r=await makeInvoiceFor(groups[b.dataset.inv]); renderInv(); if(r&&r.url) window.open(r.url,'_blank'); });
}

// ===== 起動 =====
render(); pull(); loadMaster();
setInterval(pull, 60*1000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
</script>
</body>
</html>
