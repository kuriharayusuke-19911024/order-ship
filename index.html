<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注文・発送管理｜栗原の丹波栗</title>
<meta name="theme-color" content="#5a3a1c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="注文発送">
<style>
:root{
  --paper:#f4f3ee; --card:#ffffff; --ink:#22201b; --sub:#6d685e; --line:#dedad0;
  --kuri:#6b4423; --kuri-2:#8a5a2b;
  --s1:#8b95a3; --s2:#d9861c; --s3:#3f8f4a; --s4:#2f6fb0; --s5:#5a3a1c;
  --danger:#b93a2e;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 "Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--kuri-2)}

/* header */
.top{position:sticky;top:0;z-index:5;background:var(--kuri);color:#fff;padding:10px 14px 8px;box-shadow:0 2px 6px rgba(0,0,0,.18)}
.top .row{display:flex;align-items:center;gap:10px}
.top h1{font-size:17px;margin:0;flex:1;font-weight:700;letter-spacing:.02em}
.top select{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:8px;padding:5px 8px;font-size:13px;max-width:150px}
.top select option{color:var(--ink)}
.sync{font-size:11.5px;opacity:.85;display:flex;align-items:center;gap:5px;margin-top:5px}
.dot{width:8px;height:8px;border-radius:50%;background:#bbb}
.dot.ok{background:#7fd88a}.dot.ng{background:#ff9b8e}.dot.busy{background:#ffd76a}

/* filters */
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;white-space:nowrap}
.chip b{margin-left:4px;font-weight:700}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.warn{border-color:#d9480f;color:#d9480f;background:#fff4ec}.chip.warn.on{background:#d9480f;color:#fff}
.todo{margin:10px 12px 0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.todo h3{margin:0 0 6px;font-size:14px;color:var(--sub);font-weight:600}
.todo .tl{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.todo button{border:1px solid var(--line);background:#f7f4ee;border-radius:10px;padding:8px 10px;text-align:left;font-size:13.5px;display:flex;justify-content:space-between;align-items:center}
.todo button b{font-size:18px;margin-left:6px}.todo button.zero{opacity:.45}.todo button.hot{border-color:#d9480f;background:#fff4ec;color:#d9480f}
.dhead{font-size:13px;color:var(--sub);font-weight:700;margin:6px 2px -4px;display:flex;align-items:center;gap:8px}.dhead:after{content:"";flex:1;border-top:1px dashed var(--line)}.dhead.late{color:var(--danger)}.dhead.today{color:#d9861c}
.cthumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line);flex:none;margin-left:8px}
.card .h{align-items:flex-start}.card .h .ht{flex:1;display:flex;justify-content:space-between;gap:8px;align-items:baseline;min-width:0}
.card.trash{opacity:.7;border-style:dashed}
.chip.trash{color:var(--sub)}
.stat{margin:8px 0 14px}.stat h4{margin:0 0 6px;font-size:14px}.bar{display:grid;grid-template-columns:5.5em 1fr 6em;gap:8px;align-items:center;font-size:13px;margin:3px 0}.bar i{display:block;height:14px;background:var(--kuri-2);border-radius:4px;min-width:2px}.bar span:last-child{text-align:right;white-space:nowrap}
.limitbar{margin:8px 14px 0;background:#eef4ff;border:1px solid #b9cdf3;border-radius:10px;padding:8px 12px;font-size:13px}
.hist .chg{color:#555}
.needchk{display:inline-block;background:#fff4ec;color:#d9480f;border:1px solid #f3c8ad;border-radius:8px;padding:2px 8px;font-size:12.5px;margin:4px 0}
.tools{display:flex;gap:8px;padding:6px 14px 4px;align-items:center}
.tools input{flex:1;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:var(--card)}
.tools select{border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:var(--card);font-size:13.5px}

/* list */
.list{padding:8px 14px 100px;display:grid;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;cursor:pointer}
.card.mine{border-left:4px solid var(--kuri-2)}
.card .h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.card .cust{font-weight:700;font-size:16px}
.card .date{color:var(--sub);font-size:12.5px;white-space:nowrap}
.card .items{font-size:14px;margin:4px 0 2px}
.card .meta{color:var(--sub);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 12px}
.card .meta .late{color:var(--danger);font-weight:700}
.card .clip{font-size:12px;color:var(--sub)}
.steps{display:flex;gap:3px;margin:9px 0 6px}
.steps i{flex:1;height:6px;border-radius:3px;background:#e6e2d8}
.steps i.done{background:var(--c)}
.stline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stname{font-size:13px;font-weight:700;color:var(--c)}
.next{border:0;background:var(--c);color:#fff;border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:700}
.next:disabled{background:#cfcac0}
.empty{text-align:center;color:var(--sub);padding:50px 20px;font-size:14px}

/* fab */
.fab{position:fixed;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));background:var(--kuri-2);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-size:16px;font-weight:700;box-shadow:0 6px 16px rgba(80,50,20,.35);z-index:4}

/* sheet / modal */
.sheet{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet .inner{background:var(--paper);width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:16px 16px 0 0;padding:0 0 calc(24px + env(safe-area-inset-bottom))}
@media(min-width:700px){.sheet{align-items:center}.sheet .inner{border-radius:16px;max-height:90vh}}
.sheet .bar{position:sticky;top:0;background:var(--paper);display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;border-bottom:1px solid var(--line);z-index:1}
.sheet .bar h2{margin:0;font-size:17px}
.x{border:0;background:none;font-size:24px;line-height:1;padding:2px 6px;color:var(--sub)}
.body{padding:12px 16px}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:3px}
.f input,.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fff}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.irow{display:grid;grid-template-columns:1fr 62px 52px 84px 46px 28px;gap:4px;margin-bottom:6px;align-items:center}
.irow input,.irow select{padding:8px 6px;font-size:14px}
.irow select{border:1px solid var(--line);border-radius:8px;background:#fff}
.ihead{display:grid;grid-template-columns:1fr 62px 52px 84px 46px 28px;gap:4px;font-size:11px;color:var(--sub);padding:0 4px 2px}
.subtot{text-align:right;font-size:13px;color:var(--sub);margin:2px 0 4px}
.subtot b{color:var(--ink);font-size:15px}
.docline{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
.docline a{font-size:14px}
.chk{display:flex;align-items:center;gap:6px;font-size:13.5px}
.chk input{width:18px;height:18px}
.inv-row{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;align-items:center;gap:10px}
.inv-row .n{flex:1}
.inv-row .n b{display:block;font-size:15px}
.inv-row .n span{font-size:12.5px;color:var(--sub)}
.inv-row .amt{font-weight:700;white-space:nowrap}
.shiprow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.shiprow select{width:auto;flex:1;min-width:90px}
.shipout{font-size:13px;color:var(--sub);flex-basis:100%}
.irow input{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 8px;background:#fff}
.irow button{border:0;background:none;color:var(--sub);font-size:20px}
.add{border:1px dashed var(--kuri-2);color:var(--kuri-2);background:none;border-radius:8px;padding:7px 12px;font-size:13.5px;width:100%}
.file{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.file label.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:14px;cursor:pointer;color:var(--ink)}
.file input[type=file]{display:none}
.thumb{max-width:100%;max-height:220px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:8px}
.filename{font-size:13px;color:var(--sub)}
.btns{display:flex;gap:8px;margin-top:6px}
.primary{flex:1;border:0;background:var(--kuri-2);color:#fff;border-radius:10px;padding:13px;font-size:16px;font-weight:700}
.ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:13px 16px;font-size:15px}
.ghost.danger{color:var(--danger);border-color:#e8c2bd}

/* detail */
.dl{display:grid;grid-template-columns:5.5em 1fr;gap:6px 8px;font-size:14.5px}
.dl b{color:var(--sub);font-weight:600;font-size:13px;padding-top:2px}
.dl ul{margin:0;padding-left:18px}
.stbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin:12px 0}
.stbox .now{font-size:13px;color:var(--sub)}
.stbox .big{font-size:22px;font-weight:700;color:var(--c);margin:2px 0 8px}
.stbtns{display:flex;gap:8px}
.stbtns .next{flex:1;padding:12px;font-size:15px}
.stbtns .back{border:1px solid var(--line);background:#fff;border-radius:8px;padding:12px 14px;font-size:14px;color:var(--sub)}
.hist{font-size:12.5px;color:var(--sub);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.hist div{margin:2px 0}
.confirm{background:#fff5f3;border:1px solid #e8c2bd;border-radius:10px;padding:12px;margin-top:10px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;z-index:30;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw}
.notice{margin:8px 14px 0;background:#fff6dd;border:1px solid #ecd48c;border-radius:10px;padding:8px 12px;font-size:13px}
.monthly{margin:10px 12px 0;background:#fff;border:1px solid var(--line,#e5e0d6);border-radius:12px;padding:10px 12px}
.monthly .mrow{display:flex;align-items:center;gap:8px}.monthly .mrow b{font-size:15px}.monthly .msub{margin-left:auto;font-size:12px;color:var(--sub)}
.mnav{border:1px solid var(--line,#e5e0d6);background:#fff;border-radius:8px;width:30px;height:30px;font-size:18px;cursor:pointer}
.mstats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}.mstats div{background:#f7f4ee;border-radius:8px;padding:6px 8px}.mstats small{display:block;font-size:11px;color:var(--sub)}.mstats b{font-size:16px}
.mby{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;font-size:12px;color:var(--sub)}.mby span{background:#f7f4ee;border-radius:999px;padding:3px 9px}
</style>
</head>
<body>

<header class="top">
  <div class="row">
    <h1>注文・発送管理</h1>
    <select id="me" title="自分の名前"></select>
  </div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncmsg">読み込み中…</span></div>
</header>

<div class="notice" id="noapi" hidden>API_URLが未設定のため、この端末だけに保存されています。共有するにはGASのURLを設定してください。</div>

<div class="limitbar" id="limitbar" hidden></div>
<div class="todo" id="todo">
  <h3>今日やること</h3>
  <div class="tl" id="todoList"></div>
</div>
<div class="monthly" id="monthly">
  <div class="mrow"><button class="mnav" id="mPrev">‹</button><b id="mLabel"></b><button class="mnav" id="mNext">›</button><span class="msub">注文日で集計</span><button class="mnav" id="openStat" title="売上グラフ" style="width:auto;padding:0 8px;font-size:14px">📊</button></div>
  <div class="mstats"><div><small>件数</small><b id="mCount">0</b></div><div><small>税込合計</small><b id="mTotal">¥0</b></div><div><small>税抜</small><b id="mSub">¥0</b></div><div><small>未入金</small><b id="mUnpaid">¥0</b></div></div>
  <div class="mby" id="mBy"></div>
</div>
<div class="chips" id="chips"></div>
<div class="tools">
  <input id="q" type="search" placeholder="注文元・商品・発送先で検索">
  <select id="cust" style="max-width:42%"><option value="">会社：すべて</option></select>
  <select id="dest" style="max-width:38%" hidden><option value="">発送先：すべて</option></select>
  <select id="sort"><option value="due">納期順</option><option value="new">新しい順</option></select>
  <button class="ghost" id="openInv" style="padding:7px 10px;font-size:13.5px;white-space:nowrap">請求書</button>
</div>
<div class="list" id="list"></div>

<button class="fab" id="fab">＋ 注文を登録</button>

<!-- 登録・編集 -->
<div class="sheet" id="form" hidden>
  <div class="inner">
    <div class="bar"><h2 id="formTitle">注文を登録</h2><button class="x" data-close="form">×</button></div>
    <div class="body">
      <input type="hidden" id="fId">
      <div class="f2">
        <div class="f"><label>注文日</label><input type="date" id="fDate"></div>
        <div class="f"><label>納期（発送希望日）</label><input type="date" id="fDue"></div>
      </div>
      <div class="f"><label>注文元（お客様・取引先）</label><input id="fCust" list="custList" placeholder="例：藤代商店" autocomplete="off"><datalist id="custList"></datalist></div>
      <div class="f"><label>商品・数量・単価（税抜）</label>
        <div class="ihead"><span>商品名</span><span>数量</span><span>単位</span><span>単価</span><span>税率</span><span></span></div>
        <div id="items"></div>
        <div class="subtot" id="subtot"></div>
        <button class="add" id="addItem">＋ 商品を追加</button>
        <datalist id="prodList"></datalist>
      </div>
      <div class="f2">
        <div class="f"><label>発注No（注文書の番号）</label><input id="fOrderNo" placeholder="例：00620361"><input type="hidden" id="fShipCode"></div>
        <div class="f"><label>先方の担当者</label><input id="fContact" placeholder="例：川島大河"></div>
      </div>
      <div class="f"><label>発送先（名前）</label><input id="fShipTo" placeholder="注文元と同じなら空欄でOK"></div>
      <div class="f"><label>発送先住所・電話</label><textarea id="fAddr" placeholder="住所、電話番号、時間指定など"></textarea></div>
      <div class="f"><label>送料（住所から都道府県を判定して自動計算・税抜＋加算）</label>
        <div class="shiprow">
          <select id="fShipType"><option value="">送料を選択…</option><option value="none">送料なし（引取など）</option><option value="常温">常温</option><option value="冷蔵">クール冷蔵</option><option value="冷凍">クール冷凍</option><option value="negi">岩津ねぎ（森下さん発送）</option></select>
          <select id="fSize"></select>
          <select id="fPref"></select>
          <span class="shipout" id="shipOut"></span>
        </div>
      </div>
      <div class="f2">
        <div class="f"><label>発送の担当者</label><select id="fAssignee"></select></div>
        <div class="f"><label>ステータス</label><select id="fStatus"></select></div>
      </div>
      <div class="f2">
        <div class="f"><label>発送日（納品書の日付）</label><input type="date" id="fShipDate"></div>
        <div class="f"><label>納品書</label><label class="chk" style="margin-top:8px"><input type="checkbox" id="fShowPrice" checked> 金額を載せる</label></div>
      </div>
      <div class="f2">
        <div class="f"><label>伝票番号（問合せNo）</label><input id="fTracking" placeholder="例：4403-8942-1920"></div>
        <div class="f"><label>店着日</label><input type="date" id="fArrival"></div>
      </div>
      <div class="f"><label>配送時間指定</label><select id="fTimeSlot"><option value="">指定なし</option></select></div>
      <div class="f"><label>メモ・伝えたいこと</label><textarea id="fMemo" placeholder="例：熨斗あり／クール便で"></textarea></div>
      <div class="f"><label>メールで来た注文はここに本文を貼る</label>
        <textarea id="fMail" placeholder="注文メールの本文をコピーして貼り付け → 「読み取る」" style="min-height:60px"></textarea>
        <button class="add" id="readMail" type="button" style="margin-top:6px">✉ メール本文を読み取る</button>
      </div>
      <div class="f"><label>注文書（写真・PDF）</label>
        <div class="file">
          <label class="btn">📷 撮影する<input type="file" id="fCam" accept="image/*" capture="environment"></label>
          <label class="btn">📎 ファイルを選ぶ<input type="file" id="fFile" accept="image/*,application/pdf"></label>
          <span class="filename" id="fileName"></span>
        </div>
        <img class="thumb" id="fThumb" hidden alt="">
      </div>
      <div class="btns">
        <button class="primary" id="save">保存する</button>
      </div>
    </div>
  </div>
</div>

<!-- 詳細 -->
<div class="sheet" id="detail" hidden>
  <div class="inner">
    <div class="bar"><h2 id="dTitle"></h2><button class="x" data-close="detail">×</button></div>
    <div class="body" id="dBody"></div>
  </div>
</div>

<!-- 月末請求 -->
<div class="sheet" id="inv" hidden>
  <div class="inner">
    <div class="bar"><h2>請求書をまとめて作る</h2><button class="x" data-close="inv">×</button></div>
    <div class="body">
      <div class="f"><label>対象月（発送日で絞り込み）</label><div style="display:flex;gap:8px;align-items:center"><input type="month" id="invMonth" style="flex:1"><label style="display:flex;align-items:center;gap:4px;font-size:13.5px;white-space:nowrap"><input type="checkbox" id="invAll">全期間</label></div></div>
      <div class="f"><div style="font-size:13.5px;color:var(--sub)">選んだ月に発送した「発送済」で未請求の注文を、注文元ごとにまとめて1枚の請求書にします（発送日・納期が未入力の注文はどの月でも表示）。作成後は「請求済」になります。</div></div>
      <div id="invList"></div>
    </div>
  </div>
</div>

<!-- 売上 -->
<div class="sheet" id="stat" hidden>
  <div class="inner">
    <div class="bar" style="display:flex"><h2>売上のようす</h2><button class="x" data-close="stat">×</button></div>
    <div class="body" id="statBody">読み込み中…</div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
// ===== 設定 =====
const API_URL = 'https://script.google.com/macros/s/AKfycbygQB1AB_PSgpIQM1Kzf_hxN8vwmDmEbMqwM_GGr8GuQCfUEFqDhenZLnGC2JuMDg5V/exec'; // ← GASのウェブアプリURLを貼る（空ならこの端末だけに保存）
const MEMBERS = ['栗原直人','栗原優介','秋山龍之輔','栗原亜美','木村みき','栗原美智代','松本琉雅','森下'];
const NEGI_FEE = {kansai:1000, other:1500}; // 岩津ねぎ（森下さん発送）の概算送料
const TIME_SLOTS = ['午前中','12-14時','14-16時','16-18時','18-20時','19-21時'];
const STATUS = ['受注','発送依頼','発送済','請求済','入金済'];
const SCOLOR = ['var(--s1)','var(--s2)','var(--s3)','var(--s4)','var(--s5)'];
const STEP_LABEL = ['発送を依頼する','発送した','請求した','入金を確認した'];

// ===== 状態 =====
let orders = JSON.parse(localStorage.getItem('orders')||'[]');
let pending = JSON.parse(localStorage.getItem('pending')||'[]');
let me = localStorage.getItem('me')||'';
let appKey = localStorage.getItem('appKey')||'';
let keyPromise=null, keyDeclined=false;
// 暗証番号は1回だけ聞く（同時に複数の通信が走っても1つのダイアログにまとめる）。正しいか確認してから保存する
function ensureKey(force){
  if(appKey && !force) return Promise.resolve(true);
  if(keyPromise) return keyPromise;
  keyPromise=(async()=>{
    for(let i=0;i<3;i++){
      const k=prompt(i?'暗証番号が違います。もう一度入力してください':'アプリの暗証番号を入力してください（初回のみ）');
      if(k===null){ keyDeclined=true; return false; }
      const t=k.trim(); if(!t) continue;
      try{ const j=await (await fetch(API_URL+'?action=master&key='+encodeURIComponent(t)+'&t='+Date.now())).json(); if(!j.error){ appKey=t; localStorage.setItem('appKey',t); keyDeclined=false; return true; } }catch(_){ }
    }
    keyDeclined=true; return false;
  })().finally(()=>{ keyPromise=null; });
  return keyPromise;
}
async function needKey(){ if(appKey) return; if(keyDeclined) throw new Error('暗証番号が未入力です'); if(!(await ensureKey())) throw new Error('暗証番号が未入力です'); }
async function getJson(url){ await needKey(); let r=await fetch(url+'&key='+encodeURIComponent(appKey)); let j=await r.json(); if(j.error==='unauthorized'){ appKey=''; localStorage.removeItem('appKey'); if(!(await ensureKey(true))) throw new Error('暗証番号が未入力です'); r=await fetch(url+'&key='+encodeURIComponent(appKey)); j=await r.json(); } return j; }
let filter = 'all', pendingFile = null;
let custFilter = localStorage.getItem('custFilter')||'';
let destFilter = '';
let limited = '';   // 担当者限定モード（限定暗証番号で入った人の名前）
const addDays = n=>{ const d=new Date(); d.setDate(d.getDate()+n); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
const isTodayShip = o=>o.status==='発送依頼' && (!o.due || o.due<=today());
const isSoon = o=>(o.status==='受注'||o.status==='発送依頼') && o.due && o.due>today() && o.due<=addDays(2);
const isNoTrack = o=>o.status==='発送済' && !o.tracking && (o.shipDate||'')>=addDays(-7);
// 要確認：LINEから自動登録されてまだ確認していない／送料・単価が未入力（入金済を除く）
function needsCheck(o){ if(o.deleted||o.status==='入金済') return false; if(o.viaLine && !o.checked) return true; const its=(o.items||[]).filter(i=>i.name); if(!its.length) return true; if(its.some(i=>i.name!=='送料' && !(Number(i.price)>0))) return true; if(!o.shipType) return true; return false; }
let master = JSON.parse(localStorage.getItem('master')||'{"settings":{},"products":[],"ship":[]}');
const ZONES = ['南九州','北九州','四国','中国','関西','北陸','東海','信越','関東','南東北','北東北','北海道'];
const PREF_ZONE = {'熊本':0,'宮崎':0,'鹿児島':0,'福岡':1,'佐賀':1,'長崎':1,'大分':1,'徳島':2,'香川':2,'愛媛':2,'高知':2,'鳥取':3,'島根':3,'岡山':3,'広島':3,'山口':3,'滋賀':4,'京都':4,'大阪':4,'兵庫':4,'奈良':4,'和歌山':4,'富山':5,'石川':5,'福井':5,'岐阜':6,'静岡':6,'愛知':6,'三重':6,'新潟':7,'長野':7,'茨城':8,'栃木':8,'群馬':8,'埼玉':8,'千葉':8,'東京':8,'神奈川':8,'山梨':8,'宮城':9,'山形':9,'福島':9,'青森':10,'岩手':10,'秋田':10,'北海道':11,'沖縄':-1};
const PREFS = Object.keys(PREF_ZONE);
function detectPref(text){ const t=String(text||''); let best=null,pos=1e9; PREFS.forEach(p=>{ const i=t.indexOf(p); if(i>=0 && i<pos){ pos=i; best=p; } }); return best; }
function shipFee(type,size,pref){
  const ship=master.ship||[]; if(!type||!pref||!(pref in PREF_ZONE)) return null;
  if(type==='negi'){ const z=PREF_ZONE[pref]; const fee=z===4?NEGI_FEE.kansai:NEGI_FEE.other; return {fee, base:fee, cool:0, add:0, zone:ZONES[z]||pref, negi:true}; }
  const z=PREF_ZONE[pref]; if(z<0) return {err:'沖縄は別途料金'};
  const base=ship.find(r=>r.type===(type==='常温'?'常温':'クール') && r.size===Number(size)); if(!base) return {err:'該当サイズなし'};
  let fee=base.rates[z]||0; let cool=0;
  if(type!=='常温'){ const c=ship.filter(r=>r.type==='クール加算').sort((a,b)=>a.kg-b.kg).find(r=>r.kg>=base.kg); cool=c?c.rates[0]:0; }
  const add=Number((master.settings||{})['送料加算'])||0;
  return {fee:fee+cool+add, base:fee, cool, add, zone:ZONES[z]};
}
function sizesFor(type){ if(type==='negi') return []; return [...new Set((master.ship||[]).filter(r=>r.type===(type==='常温'?'常温':'クール')).map(r=>r.size))].sort((a,b)=>a-b); }
const yen = n=>'¥'+Math.round(Number(n)||0).toLocaleString('ja-JP');
function calcItems(items){
  const byTax={}; let sub=0;
  (items||[]).forEach(i=>{ const a=(Number(i.qty)||0)*(Number(i.price)||0); const t=(i.tax===''||i.tax==null)?8:Number(i.tax); sub+=a; byTax[t]=(byTax[t]||0)+a; });
  const tax=Object.keys(byTax).reduce((a,t)=>a+Math.floor(byTax[t]*(+t)/100),0);
  return {sub,tax,total:sub+tax};
}
async function loadMaster(){
  if(!API_URL) return;
  try{ const j=await getJson(API_URL+'?action=master&t='+Date.now()); if(j.products){ master=j; localStorage.setItem('master',JSON.stringify(master)); renderProdList(); if(!$('form').hidden) fillShipUI(); } }catch(e){ console.error(e); }
}

function upsertShipItem(){
  const type=shipTypeVal(), size=$('fSize').value, pref=$('fPref').value;
  const rows=[...$('items').children]; const shipRow=rows.find(r=>r.querySelector('input').value.trim()==='送料');
  if(!type){ $('shipOut').textContent=''; if(shipRow && $('fShipType').value==='none'){ shipRow.remove(); updSub(); } return; }
  const r=shipFee(type,size,pref);
  if(!r||r.err){ $('shipOut').textContent=r?r.err:'都道府県を選んでください'; return; }
  $('shipOut').textContent=r.negi?`${r.zone}：岩津ねぎ送料 ${yen(r.fee)}（概算・税抜10%）`:`${r.zone}：運賃 ${yen(r.base)}${r.cool?` ＋クール ${yen(r.cool)}`:''} ＋加算 ${yen(r.add)} ＝ 送料 ${yen(r.fee)}（税抜・10%）`;
  const it={name:'送料',qty:1,unit:'式',price:r.fee,tax:10};
  if(shipRow){ const [n,q,u,p]=shipRow.querySelectorAll('input'); q.value=1; u.value='式'; p.value=r.fee; shipRow.querySelector('select').value='10'; }
  else { const empty=rows.find(x=>!x.querySelector('input').value.trim()); const el=itemRow(it); if(empty) $('items').replaceChild(el,empty); else $('items').appendChild(el); }
  updSub();
}
const esc = s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = ()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;};
const fmt = s=>s? s.replace(/^(\d{4})-(\d{2})-(\d{2}).*/,(m,y,mo,d)=>`${+mo}/${+d}`):'—';
const now = ()=>new Date().toISOString();

// ===== 同期（GAS） =====
async function api(body){
  await needKey();
  body.key = appKey;
  let r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)});
  let j = await r.json();
  if(j.error==='unauthorized'){ appKey=''; localStorage.removeItem('appKey'); if(!(await ensureKey(true))) throw new Error('暗証番号が未入力です'); body.key=appKey; r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body)}); j=await r.json(); }
  if(j.error) throw new Error(j.error); return j;
}
async function pull(){
  if(!API_URL){ $('noapi').hidden=false; setSync('','この端末のみ'); return; }
  setSync('busy','同期中…');
  try{
    const j = await getJson(API_URL+'?action=list&t='+Date.now());
    if(j.limitedTo!==undefined){ limited=j.limitedTo||''; applyLimited(); }
    const map = new Map(orders.map(o=>[o.id,o]));
    (j.orders||[]).forEach(ro=>{ const lo=map.get(ro.id); if(!lo || (ro.updatedAt>lo.updatedAt && !pending.includes(ro.id))) map.set(ro.id,ro); });
    orders=[...map.values()]; persist(); render();
    await pushPending();
    setSync('ok','同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ console.error(e); setSync('ng', /暗証番号/.test(e.message)? '暗証番号が未入力です（ここをタップして入力）' : '同期できません（オフライン？）'); }
}
async function pushPending(){
  if(!API_URL) return;
  for(const id of [...pending]){
    const o = orders.find(x=>x.id===id); if(!o){ pending=pending.filter(x=>x!==id); continue; }
    try{ await api({action:'save',order:o}); pending=pending.filter(x=>x!==id); persist(); }
    catch(e){ console.error(e); setSync('ng','送信待ちあり（あとで再送します）'); return; }
  }
}
function applyLimited(){
  $('limitbar').hidden=!limited; if(limited){ $('limitbar').textContent=limited+'さんの担当分だけ表示しています（発送の報告のみできます）'; me=limited; localStorage.setItem('me',me); $('me').innerHTML=`<option>${esc(limited)}</option>`; }
  $('fab').hidden=!!limited; $('openInv').hidden=!!limited; $('monthly').hidden=!!limited; $('openStat').hidden=!!limited;
}
function saveOrder(o){
  o.updatedAt = now();
  const i = orders.findIndex(x=>x.id===o.id); if(i>=0) orders[i]=o; else orders.unshift(o);
  if(!pending.includes(o.id)) pending.push(o.id);
  persist(); render(); pushPending().then(()=>{ if(API_URL && !pending.length) setSync('ok','同期済み'); });
}

function visible(){ return orders.filter(o=>!o.deleted); }
let mCur=(()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');})();
function shiftMonth(n){ const [y,m]=mCur.split('-').map(Number); const d=new Date(y,m-1+n,1); mCur=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); renderMonthly(); }
function renderMonthly(){
  const list=visible().filter(o=>String(o.orderDate||o.createdAt||'').slice(0,7)===mCur);
  let sub=0,total=0,unpaid=0; const by={};
  list.forEach(o=>{ const c=calcItems(o.items); sub+=c.sub; total+=c.total; if(o.status!=='入金済') unpaid+=c.total; by[o.status]=(by[o.status]||0)+1; });
  const [y,m]=mCur.split('-'); $('mLabel').textContent=`${y}年${+m}月`;
  $('mCount').textContent=list.length+'件'; $('mTotal').textContent=yen(total); $('mSub').textContent=yen(sub); $('mUnpaid').textContent=yen(unpaid);
  $('mBy').innerHTML=STATUS.filter(s=>by[s]).map(s=>`<span>${s} ${by[s]}</span>`).join('')||'<span>注文なし</span>';
}
function render(){
  renderMonthly();
  const vis = visible();
  // 会社の選択肢
  const custs=[...new Set(vis.map(o=>o.customer).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja'));
  if(custFilter && !custs.includes(custFilter)) custFilter='';
  $('cust').innerHTML='<option value="">会社：すべて</option>'+custs.map(c=>`<option value="${esc(c)}" ${c===custFilter?'selected':''}>${esc(c)}（${vis.filter(o=>o.customer===c).length}）</option>`).join('');
  // 今日やること
  const todo=[['check','⚠ 要確認',vis.filter(needsCheck).length,'hot'],['todayShip','🚚 今日発送する',vis.filter(isTodayShip).length,'hot'],['soon','📅 納期が2日以内',vis.filter(isSoon).length,''],['notrack','🔢 伝票番号なし',vis.filter(isNoTrack).length,'']];
  $('todoList').innerHTML=todo.map(([k,l,n,h])=>`<button data-k="${k}" class="${n?h:'zero'}">${l}<b>${n}</b></button>`).join('');
  let byCust = custFilter ? vis.filter(o=>o.customer===custFilter) : vis;
  // 発送先の絞り込み（会社を選んだときだけ）
  const dests = custFilter ? [...new Set(byCust.map(o=>o.shipTo||'').filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ja')) : [];
  if(destFilter && !dests.includes(destFilter)) destFilter='';
  $('dest').hidden = dests.length<2;
  $('dest').innerHTML='<option value="">発送先：すべて</option>'+dests.map(d=>`<option value="${esc(d)}" ${d===destFilter?'selected':''}>${esc(d)}（${byCust.filter(o=>o.shipTo===d).length}）</option>`).join('');
  if(destFilter) byCust = byCust.filter(o=>o.shipTo===destFilter);
  const trash = orders.filter(o=>o.deleted);
  const counts = {all:byCust.length, check:byCust.filter(needsCheck).length, mine:byCust.filter(o=>o.assignee===me && o.status!=='入金済').length, todayShip:byCust.filter(isTodayShip).length, soon:byCust.filter(isSoon).length, notrack:byCust.filter(isNoTrack).length, trash:trash.length};
  STATUS.forEach(s=>counts[s]=byCust.filter(o=>o.status===s).length);
  const chips = [['check','⚠ 要確認'],['all','すべて'],['mine','自分の担当'],...STATUS.map(s=>[s,s]),['trash','🗑 ゴミ箱']];
  const extraChip = {todayShip:'🚚 今日発送',soon:'📅 納期2日以内',notrack:'🔢 伝票なし'}[filter];
  $('chips').innerHTML = (extraChip?`<button class="chip on" data-k="${filter}">${extraChip}<b>${counts[filter]}</b></button>`:'')+chips.map(([k,l])=>`<button class="chip ${filter===k?'on':''} ${k==='check'&&counts.check?'warn':''} ${k==='trash'?'trash':''}" data-k="${k}">${l}<b>${counts[k]}</b></button>`).join('');
  const q = $('q').value.trim();
  let list = filter==='trash' ? trash : byCust.filter(o=> filter==='all' ? true : filter==='check' ? needsCheck(o) : filter==='mine' ? (o.assignee===me && o.status!=='入金済') : filter==='todayShip' ? isTodayShip(o) : filter==='soon' ? isSoon(o) : filter==='notrack' ? isNoTrack(o) : o.status===filter);
  if(q) list = list.filter(o=>[o.customer,o.shipTo,o.memo,(o.items||[]).map(i=>i.name).join(' ')].join(' ').includes(q));
  const sort = $('sort').value;
  list.sort((a,b)=> sort==='new' ? (b.updatedAt>a.updatedAt?1:-1) : ((a.due||'9')+a.orderDate).localeCompare((b.due||'9')+b.orderDate));
  if(filter==='all') list.sort((a,b)=> (a.status==='入金済')-(b.status==='入金済'));
  // 納期ごとの見出し
  let html='';
  if(filter==='trash'){ html = list.length ? `<div class="notice" style="margin:0">削除から30日で自動的に消えます。<button class="ghost danger" id="purgeAll" style="padding:4px 10px;font-size:13px;margin-left:8px">今すぐ空にする</button></div>`+list.map(o=>card(o,true)).join('') : '<div class="empty">ゴミ箱は空です</div>'; }
  else if(sort==='due' && list.length){
    let last=null; const wd=['日','月','火','水','木','金','土'];
    list.forEach(o=>{ const key=(o.status==='入金済')?'done':(o.due||'none'); if(key!==last){ last=key; const cnt=list.filter(x=>((x.status==='入金済')?'done':(x.due||'none'))===key).length; let label, cls='';
        if(key==='done') label='入金済'; else if(key==='none') label='納期未定'; else { const d=new Date(key+'T00:00:00'); label=`${d.getMonth()+1}/${d.getDate()}（${wd[d.getDay()]}）`; if(key<today()&&o.status!=='発送済'&&o.status!=='請求済'){ cls='late'; label+=' 納期超過'; } else if(key===today()){ cls='today'; label+=' 今日'; } }
        html+=`<div class="dhead ${cls}">${label}・${cnt}件</div>`; } html+=card(o); });
  } else html = list.map(card).join('');
  $('list').innerHTML = html || `<div class="empty">${q?'該当する注文はありません':'注文はまだありません。右下の「＋ 注文を登録」から追加できます。'}</div>`;
  const pa=$('purgeAll'); if(pa) pa.onclick=async()=>{ if(!confirm('ゴミ箱の注文をすべて完全に削除します。元に戻せません。よろしいですか？')) return; try{ await api({action:'purge'}); orders=orders.filter(o=>!o.deleted); persist(); render(); toast('ゴミ箱を空にしました'); }catch(e){ toast('失敗：'+e.message); } };
  // datalists
  $('custList').innerHTML=[...new Set(orders.map(o=>o.customer).filter(Boolean))].map(c=>`<option value="${esc(c)}">`).join('');
  renderProdList();
}
function itemsText(o){ return (o.items||[]).map(i=>`${i.name}${i.qty?` ×${i.qty}${i.unit||''}`:''}`).join('、')||'（商品未入力）'; }
function orderTotal(o){ const c=calcItems(o.items); return c.sub? yen(c.total)+'（税込）' : ''; }
function card(o, inTrash){
  const si = STATUS.indexOf(o.status), c=SCOLOR[si];
  const late = o.due && o.due<today() && si<2;
  const th = (o.fileUrl && o.fileType?.startsWith('image')) ? `<img class="cthumb" src="${esc(o.fileUrl)}=s120" alt="" loading="lazy">` : '';
  if(inTrash) return `<div class="card trash" data-id="${o.id}" style="--c:${c}">
    <div class="h"><div class="ht"><span class="cust">${esc(o.customer||'（注文元未入力）')}</span><span class="date">削除 ${fmt((o.deletedAt||o.updatedAt||'').slice(0,10))}</span></div></div>
    <div class="items">${esc(itemsText(o))}</div>
    <div class="meta"><span>納期 ${fmt(o.due)}</span><span>${esc(o.status)}</span>${orderTotal(o)?`<span>${orderTotal(o)}</span>`:''}</div>
    <div class="stline"><span></span><button class="next" data-restore="${o.id}" style="--c:var(--s3)">↩ 元に戻す</button></div></div>`;
  return `<div class="card ${o.assignee===me?'mine':''}" data-id="${o.id}" style="--c:${c}">
    <div class="h"><div class="ht"><span class="cust">${esc(o.customer||'（注文元未入力）')}</span><span class="date">注文 ${fmt(o.orderDate)}</span></div>${th}</div>
    ${needsCheck(o)?`<div class="needchk">⚠ 要確認${o.viaLine&&!o.checked?'（LINEから自動登録）':''}${!o.shipType?'・送料未設定':''}${(o.items||[]).some(i=>i.name&&i.name!=='送料'&&!(Number(i.price)>0))?'・単価未入力':''}</div>`:''}
    <div class="items">${esc(itemsText(o))}</div>
    <div class="meta"><span class="${late?'late':''}">納期 ${fmt(o.due)}${late?'（遅れ）':''}</span><span>担当 ${esc(o.assignee||'未定')}</span>${o.shipTo?`<span>宛先 ${esc(o.shipTo)}</span>`:''}${orderTotal(o)?`<span>${orderTotal(o)}</span>`:''}${o.fileUrl||o.fileData?`<span class="clip">📎 注文書</span>`:''}${o.deliveryUrl?`<span class="clip">📄 納品書</span>`:''}${o.invoiceUrl?`<span class="clip">🧾 請求書</span>`:''}</div>
    <div class="steps">${STATUS.map((s,i)=>`<i class="${i<=si?'done':''}"></i>`).join('')}</div>
    <div class="stline"><span class="stname">${esc(o.status)}</span>${si<4?`<button class="next" data-next="${o.id}">${STEP_LABEL[si]}</button>`:'<span class="stname">完了</span>'}</div>
  </div>`;
}

function advance(id,dir){
  if(!me){ toast('先に右上で自分の名前を選んでください'); return; }
  const o=orders.find(x=>x.id===id); const i=STATUS.indexOf(o.status)+dir; if(i<0||i>=STATUS.length) return;
  if(limited && !(o.status==='発送依頼' && dir>0)){ toast('担当者限定モードでは「発送した」の報告だけできます'); return; }
  o.status=STATUS[i]; (o.history=o.history||[]).push({at:now(),by:me,to:o.status});
  if(dir>0 && o.status==='発送済' && !o.shipDate) o.shipDate=today();
  if(dir>0 && o.status==='発送済' && !o.tracking){ const t=window.prompt('伝票番号（問合せNo）があれば入力してください（なければ空欄でOK）',''); if(t && t.trim()) o.tracking=t.trim(); }
  saveOrder(o); toast(`「${o.status}」にしました`);
  if(dir>0 && o.status==='発送依頼'){ notifyLine(o); makeDelivery(o); }
  if(!$('detail').hidden) openDetail(id);
}

function itemRow(it={}){
  const d=document.createElement('div'); d.className='irow';
  const tax=(it.tax===''||it.tax==null)?8:Number(it.tax);
  d.innerHTML=`<input placeholder="商品名" list="prodList" value="${esc(it.name||'')}"><input type="number" inputmode="decimal" placeholder="数量" value="${esc(it.qty??'')}"><input placeholder="単位" value="${esc(it.unit||'')}"><input type="number" inputmode="numeric" placeholder="単価" value="${esc(it.price??'')}"><select><option value="8" ${tax===8?'selected':''}>8%</option><option value="10" ${tax===10?'selected':''}>10%</option><option value="0" ${tax===0?'selected':''}>0%</option></select><button type="button" title="削除">×</button>`;
  const [n,q,u,p]=d.querySelectorAll('input'); const t=d.querySelector('select');
  n.addEventListener('change',()=>{ const m=master.products.find(x=>x.name===n.value.trim()); if(m){ p.value=m.price||''; u.value=m.unit||''; t.value=String(m.tax); } else if(!n.value.trim()){ p.value=''; u.value=''; t.value='8'; } updSub(); });

}

async function fileToData(file){
  if(file.type.startsWith('image/')){
    const img = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); });
    const max=1600, r=Math.min(1,max/Math.max(img.width,img.height));
    const cv=document.createElement('canvas'); cv.width=Math.round(img.width*r); cv.height=Math.round(img.height*r);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    return {data:cv.toDataURL('image/jpeg',.82), type:'image/jpeg', name:file.name.replace(/\.\w+$/,'')+'.jpg'};
  }
  if(file.size>8*1024*1024) throw new Error('ファイルが大きすぎます（8MBまで）');
  const data = await new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.onerror=rej; fr.readAsDataURL(file); });
  return {data, type:file.type, name:file.name};
}
async function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  try{ pendingFile=await fileToData(f); $('fileName').textContent=pendingFile.name; if(pendingFile.type.startsWith('image')){ $('fThumb').src=pendingFile.data; $('fThumb').hidden=false; } else $('fThumb').hidden=true; }

  if(pendingFile && API_URL) readOrder();
}

$('save').onclick=async()=>{
  const cust=$('fCust').value.trim(); if(!cust){ toast('注文元を入力してください'); $('fCust').focus(); return; }
  const items=readItems();
  if(!items.length){ toast('商品を1つ以上入力してください'); return; }
  const bad=items.find(i=>i.name!=='送料' && (!(Number(i.qty)>0) || !(Number(i.price)>0)));
  if(bad){ toast(`「${bad.name}」の数量・単価を入力してください（保存には金額が必要です）`); return; }
  if(!$('fShipType').value){ toast('送料（便種）を選んでください。送料がかからない場合は「送料なし」を選択'); $('fShipType').focus(); return; }
  if($('fShipType').value!=='none'){
    const ship=items.find(i=>i.name==='送料');
    if(!ship || !(Number(ship.price)>0)){ toast('送料が計算できていません。'+($('fShipType').value==='negi'?'都道府県':'サイズと都道府県')+'を選んでください'); $('fPref').focus(); return; }
  }
  const id=$('fId').value; const old=orders.find(x=>x.id===id);
  const o = Object.assign({}, old||{id:uid(),createdAt:now(),createdBy:me,history:[]}, {
    orderDate:$('fDate').value, due:$('fDue').value, customer:cust, items, shipTo:$('fShipTo').value.trim(), addr:$('fAddr').value.trim(),
    assignee:$('fAssignee').value, status:$('fStatus').value, memo:$('fMemo').value.trim(),
    shipDate:$('fShipDate').value, showPrice:$('fShowPrice').checked,
    orderNo:$('fOrderNo').value.trim(), shipCode:$('fShipCode').value.trim(), contact:$('fContact').value.trim(), tracking:$('fTracking').value.trim(), arrival:$('fArrival').value, timeSlot:$('fTimeSlot').value,
    shipType:$('fShipType').value, size:$('fSize').value, pref:$('fPref').value
  });
  if(!o.assignee && (o.shipType==='negi' || items.some(it=>/ねぎ|ネギ|葱/.test(it.name)))) o.assignee='森下';
  if(o.viaLine) o.checked=true;
  if(!old) o.history.push({at:now(),by:me||'（名前未設定）',to:o.status+'（登録）'});
  else {
    const chg=diffOrder(old,o);
    if(old.status!==o.status) o.history.push({at:now(),by:me||'（名前未設定）',to:o.status, changes:chg.filter(c=>!/^ステータス/.test(c))});
    else if(chg.length) o.history.push({at:now(),by:me||'（名前未設定）',to:'編集', changes:chg});
  }
  if(API_URL && o.shipType && o.shipType!=='negi' && o.shipType!=='none' && o.size && (!old || old.size!==o.size || old.shipType!==o.shipType)) api({action:'learn',order:o}).catch(()=>{});
  $('save').disabled=true; $('save').textContent='保存中…';
  try{
    if(pendingFile){
      if(API_URL){ const r=await api({action:'upload',id:o.id,name:pendingFile.name,type:pendingFile.type,data:pendingFile.data.split(',')[1]}); o.fileUrl=r.url; o.fileId=r.id; delete o.fileData; }
      else { o.fileData=pendingFile.data; o.fileUrl=''; }
      o.fileName=pendingFile.name; o.fileType=pendingFile.type;
    }
    saveOrder(o); $('form').hidden=true; toast(old?'保存しました':'注文を登録しました');
    if(o.status==='発送依頼' && (!old || old.status!=='発送依頼' || old.assignee!==o.assignee)) notifyLine(o);
  }catch(err){ console.error(err); toast('保存に失敗：'+err.message); }
  $('save').disabled=false; $('save').textContent='保存する';
};

// 変更内容の差分（履歴用）
const FIELD_LABEL={orderDate:'注文日',due:'納期',customer:'注文元',shipTo:'発送先',addr:'住所',assignee:'担当',status:'ステータス',memo:'メモ',shipDate:'発送日',orderNo:'発注No',contact:'先方担当',tracking:'伝票番号',arrival:'店着日',timeSlot:'時間指定',shipType:'便種',size:'サイズ',pref:'都道府県'};
function diffOrder(a,b){
  const out=[];
  Object.keys(FIELD_LABEL).forEach(k=>{ const x=String(a[k]??''), y=String(b[k]??''); if(x!==y) out.push(`${FIELD_LABEL[k]}：${x||'（空）'}→${y||'（空）'}`); });
  const ia=(a.items||[]).map(i=>`${i.name}×${i.qty}${i.unit||''}@${i.price}`).join('、'), ib=(b.items||[]).map(i=>`${i.name}×${i.qty}${i.unit||''}@${i.price}`).join('、');
  if(ia!==ib) out.push(`商品：${ia||'（空）'}→${ib||'（空）'}`);
  return out;
}

// ===== 注文書への返信画像（商品・単価・送料・宅急便情報を記入した注文書）=====
function replyImage(o){
  const W=1000, pad=50; const cv=document.createElement('canvas'); cv.width=W; cv.height=1414; const g=cv.getContext('2d');

  const byTax={}; let sub=0; items.forEach(i=>{ const a=(Number(i.qty)||0)*(Number(i.price)||0); const t=(i.tax===''||i.tax==null)?8:Number(i.tax); sub+=a; byTax[t]=(byTax[t]||0)+a; });
  const taxes=Object.keys(byTax).map(Number).sort((a,b)=>a-b).map(t=>({rate:+t, base:byTax[t], tax:Math.floor(byTax[t]*(+t)/100)})); const taxSum=taxes.reduce((a,x)=>a+x.tax,0);

  g.fillStyle='#fff'; g.fillRect(0,0,W,cv.height);

  txt('発注日　'+(o.orderDate||''),W-pad,100,17,{a:'right'});
  if(o.orderNo) txt('発注No.　'+o.orderNo,W-pad,126,17,{a:'right'});
  txt(o.customer||'',W-pad,160,20,{a:'right',b:1});
  if(o.contact) txt('担当者：'+o.contact,W-pad,188,17,{a:'right'});
  txt('TEL '+(S['電話']||'')+'　FAX '+(S['FAX']||''),pad,165,15,{c:'#555'});
  txt('下記のとおり記入のうえ返信いたします。',pad,215,17);
  txt('納期：'+(o.due?fmtJ(o.due):'')+(o.timeSlot?'　'+o.timeSlot+'納品希望':''),pad,250,20,{b:1});
  // 明細表
  const cols=[pad,pad+420,pad+500,pad+580,pad+690,pad+810,W-pad]; const top=285, rh=40;
  g.fillStyle='#f2ede4'; g.fillRect(pad,top,W-2*pad,rh);
  line(pad,top,W-pad,top,1.5);
  ['商品名','単位','数量','単価','金額','備考'].forEach((h,i)=>txt(h,(cols[i]+cols[i+1])/2,top+27,17,{a:'center',b:1}));
  let y=top+rh; line(pad,y,W-pad,y);

  rows.push(['合計（税込）','','','',sub+taxSum,'']);
  const n=Math.max(rows.length,10);

  txt('宅急便情報記入欄',bx,yy,19,{b:1}); yy+=38;
  const carrier=o.shipType==='冷蔵'?'佐川急便 クール便（冷蔵）':o.shipType==='冷凍'?'佐川急便 クール便（冷凍）':o.shipType==='negi'?'佐川急便（森下発送）':'佐川急便';
  const box=(label,val)=>{ txt(label,bx,yy,16,{c:'#555'}); txt('【',bx+120,yy,18); txt(val,bx+140,yy,19,{c:'#1a3fa0',b:1}); txt('】',W-pad-20,yy,18); yy+=38; };
  box('配送業者名',carrier); box('問合せNO',o.tracking||''); box('店着日時',o.arrival?fmtJ(o.arrival):'');
  txt('配送時間指定（該当欄に◯）',bx,yy,16,{c:'#555'}); yy+=32;
  let sx=bx; TIME_SLOTS.slice(0,4).forEach(t=>{ const sel=o.timeSlot===t; if(sel){ g.strokeStyle='#1a3fa0'; g.lineWidth=2; g.beginPath(); g.ellipse(sx+g.measureText(t).width/2+8,yy-7,g.measureText(t).width/2+14,16,0,0,Math.PI*2); g.stroke(); } txt(t,sx,yy,16,{c:sel?'#1a3fa0':'#333',b:sel}); sx+=g.measureText(t).width+40; });
  yy+=50; txt('上記のとおり発送いたしました。',bx,yy,16);
  // フッタ
  txt((S['会社名']||'株式会社丹波農商')+'　'+(S['担当者']||'')+'　TEL '+(S['電話']||'')+'　'+(S['メール']||''),W/2,cv.height-40,14,{a:'center',c:'#666'});
  cv.toBlob(async blob=>{
    const name=(o.orderNo?'発注'+o.orderNo+'_':'')+(o.customer||'')+'_返信.png';
    const file=new File([blob],name,{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file],title:name}); return; }catch(e){ if(e.name==='AbortError') return; } }
    const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),10000); toast('返信画像を保存しました（LINEで送ってください）');
  },'image/png');
}
function fmtJ(s){ const m=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m?`${m[1]}年${+m[2]}月${+m[3]}日`:String(s||''); }
function openDetail(id){
  const o=orders.find(x=>x.id===id); if(!o) return;
  const si=STATUS.indexOf(o.status), c=SCOLOR[si];
  const fileHtml = o.fileUrl ? (o.fileType?.startsWith('image') ? `<a href="${esc(o.fileUrl)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(o.fileUrl)}" alt=""></a>` : `<a href="${esc(o.fileUrl)}" target="_blank" rel="noopener">📄 ${esc(o.fileName)} を開く</a>`)
    : o.fileData ? (o.fileType?.startsWith('image') ? `<img class="thumb" src="${o.fileData}" alt="">` : `<a href="${o.fileData}" download="${esc(o.fileName)}">📄 ${esc(o.fileName)}</a>`) : '<span style="color:var(--sub)">なし</span>';
  $('dTitle').textContent=o.customer;
  $('dBody').innerHTML=`
    <div class="dl">
      <b>注文日</b><span>${esc(o.orderDate)||'—'}</span>
      <b>納期</b><span>${esc(o.due)||'—'}</span>
      <b>商品</b><ul>${(o.items||[]).map(i=>`<li>${esc(i.name)}${i.qty?` ×${esc(i.qty)}${esc(i.unit)}`:''}</li>`).join('')}</ul>
      <b>発送先</b><span>${esc(o.shipTo||o.customer)}${o.addr?`<br><span style="white-space:pre-wrap;color:var(--sub);font-size:13.5px">${esc(o.addr)}</span>`:''}</span>
      <b>担当</b><span>${esc(o.assignee||'未定')}</span>
      ${o.orderNo||o.contact?`<b>発注No</b><span>${esc(o.orderNo||'—')}${o.contact?`　担当：${esc(o.contact)}`:''}</span>`:''}
      ${o.tracking||o.arrival||o.timeSlot?`<b>配送</b><span>${o.tracking?`伝票 ${esc(o.tracking)}`:''}${o.arrival?`　店着 ${esc(o.arrival)}`:''}${o.timeSlot?`　${esc(o.timeSlot)}`:''}</span>`:''}
      <b>メモ</b><span style="white-space:pre-wrap">${esc(o.memo)||'—'}</span>
      <b>注文書</b><span>${fileHtml}</span>
      <b>金額</b><span>${orderTotal(o)||'—'}</span>
    </div>
    <div class="docline">
      ${o.deliveryUrl?`<a href="${esc(o.deliveryUrl)}" target="_blank" rel="noopener">📄 納品書 ${esc(o.deliveryNo||'')}</a>`:''}
      <button class="ghost" id="dDeliv" style="padding:7px 12px;font-size:13.5px">${o.deliveryUrl?'納品書を作り直す':'📄 納品書を作る'}</button>
      <button class="ghost" id="dReplyLine" style="padding:7px 12px;font-size:13.5px">📤 返信画像をLINEで受け取る</button>
      <button class="ghost" id="dReply" style="padding:7px 12px;font-size:13.5px">📝 返信画像（この端末で）</button>
      <button class="ghost" id="dLabel" style="padding:7px 12px;font-size:13.5px">🏷 宛名ラベルPDF</button>
      ${o.invoiceUrl?`<a href="${esc(o.invoiceUrl)}" target="_blank" rel="noopener">🧾 請求書 ${esc(o.invoiceNo||'')}</a>`:''}
      ${!o.invoiceUrl&&STATUS.indexOf(o.status)>=2?`<button class="ghost" id="dInv" style="padding:7px 12px;font-size:13.5px">🧾 この注文だけ請求書</button>`:''}
    </div>
    <div class="stbox" style="--c:${c}">
      <div class="now">いまのステータス</div><div class="big">${esc(o.status)}</div>
      <div class="stbtns">${si<4?`<button class="next" data-adv="1">${STEP_LABEL[si]}</button>`:''}${si>0?`<button class="back" data-adv="-1">ひとつ戻す</button>`:''}</div>
      <div class="hist">${(o.history||[]).slice().reverse().map(h=>`<div>${new Date(h.at).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}　${esc(h.by)} → ${esc(h.to)}${h.changes&&h.changes.length?`<div class="chg">　${h.changes.map(esc).join('／')}</div>`:''}</div>`).join('')||'<div>履歴なし</div>'}</div>
    </div>
    ${needsCheck(o)?`<div class="needchk" style="margin:8px 0">⚠ 要確認：${o.viaLine&&!o.checked?'LINEから自動登録された注文です。内容を確認してください':'送料または単価が未入力です'}</div>`:''}
    <div class="btns">${needsCheck(o)&&!(o.items||[]).some(i=>i.name&&i.name!=='送料'&&!(Number(i.price)>0))&&o.shipType?`<button id="dChecked">✓ 確認済みにする</button>`:''}<button class="ghost" id="dEdit">✎ 編集</button><button class="ghost" id="dAgain">🔁 同じ注文をもう一度</button><button class="ghost danger" id="dDel">削除</button></div>
    <div id="dConfirm"></div>`;
  $('dBody').querySelectorAll('[data-adv]').forEach(b=>b.onclick=()=>advance(o.id,+b.dataset.adv));
  $('dEdit').onclick=()=>{ $('detail').hidden=true; openForm(o); };
  const dChk=$('dChecked'); if(dChk) dChk.onclick=()=>{ o.checked=true; o.checkedBy=me; saveOrder(o); toast('確認済みにしました'); openDetail(o.id); };
  $('dReply').onclick=()=>replyImage(o);
  $('dReplyLine').onclick=async()=>{ const b=$('dReplyLine'); b.disabled=true; b.textContent='作成中…（20秒ほど）'; try{ const r=await api({action:'replyimg',order:o,by:me}); toast(r.sent?'返信画像をLINEに送りました':'作成しました'); if(!r.sent&&r.url) window.open(r.url,'_blank'); }catch(e){ toast('作成できませんでした：'+e.message); } b.disabled=false; b.textContent='📤 返信画像をLINEで受け取る'; };
  $('dLabel').onclick=async()=>{ const b=$('dLabel'); b.disabled=true; b.textContent='作成中…'; try{ const r=await api({action:'label',order:o}); window.open(r.url,'_blank'); }catch(e){ toast('作成できませんでした：'+e.message); } b.disabled=false; b.textContent='🏷 宛名ラベルPDF'; };
  $('dAgain').onclick=()=>{ const c=Object.assign({},o,{id:'',orderDate:today(),due:'',status:'受注',shipDate:'',tracking:'',arrival:'',deliveryUrl:'',deliveryNo:'',invoiceUrl:'',invoiceNo:'',fileUrl:'',fileId:'',fileName:'',fileType:'',history:[],viaLine:false,checked:false,remindedAt:'',payRemindedAt:''}); $('detail').hidden=true; openForm(c); $('formTitle').textContent='同じ内容で新しく登録'; };
  if(limited){ ['dEdit','dAgain','dDel','dDeliv','dReply','dReplyLine','dLabel','dInv','dChecked'].forEach(id=>{ const el=$(id); if(el) el.hidden=true; }); }
  $('dDeliv').onclick=()=>{ if(!(o.items||[]).some(i=>i.name)){ toast('商品が未入力です'); return; } $('dDeliv').disabled=true; $('dDeliv').textContent='作成中…'; makeDelivery(o,true); };
  const dInv=$('dInv'); if(dInv) dInv.onclick=async()=>{ dInv.disabled=true; dInv.textContent='作成中…'; await makeInvoiceFor([o]); openDetail(o.id); };
  $('dDel').onclick=()=>{ $('dConfirm').innerHTML=`<div class="confirm">この注文をゴミ箱に入れますか？（30日間は戻せます）<div class="btns"><button class="ghost danger" id="dYes">削除する</button><button class="ghost" id="dNo">やめる</button></div></div>`;
    $('dYes').onclick=()=>{ o.deleted=true; o.deletedAt=now(); (o.history=o.history||[]).push({at:now(),by:me||'（名前未設定）',to:'ゴミ箱へ'}); saveOrder(o); $('detail').hidden=true; toast('ゴミ箱に入れました（30日で自動削除）'); }; $('dNo').onclick=()=>$('dConfirm').innerHTML=''; };
  $('detail').hidden=false; $('detail').querySelector('.inner').scrollTop=0;
}

// ===== 売上グラフ =====
$('openStat').onclick=async()=>{ $('stat').hidden=false; $('statBody').textContent='読み込み中…'; try{ const j=await getJson(API_URL+'?action=stats&t='+Date.now()); renderStat(j); }catch(e){ $('statBody').textContent='読み込めませんでした：'+e.message; } };
function renderStat(j){
  const months=Object.keys(j.months||{}).sort().slice(-6); const mx=Math.max(1,...months.map(m=>j.months[m].total));
  const bar=(label,v,max,right)=>`<div class="bar"><span>${esc(label)}</span><i style="width:${Math.round(v/max*100)}%"></i><span>${right}</span></div>`;
  const custs=Object.entries(j.byCust||{}).sort((a,b)=>b[1]-a[1]).slice(0,8); const cm=Math.max(1,...custs.map(c=>c[1]));
  const prods=Object.entries(j.byProd||{}).sort((a,b)=>b[1].amt-a[1].amt).slice(0,8); const pm=Math.max(1,...prods.map(p=>p[1].amt));
  $('statBody').innerHTML=`<div class="stat"><h4>月別の売上（税込・直近6か月）</h4>${months.map(m=>bar(m.replace('-','/'),j.months[m].total,mx,yen(j.months[m].total)+'・'+j.months[m].count+'件')).join('')||'データなし'}</div>
    <div class="stat"><h4>会社別（累計）</h4>${custs.map(([c,v])=>bar(c,v,cm,yen(v))).join('')}</div>
    <div class="stat"><h4>商品別（累計・税抜）</h4>${prods.map(([p,v])=>bar(p,v.amt,pm,yen(v.amt)+'・'+v.qty+(v.unit||''))).join('')}</div>`;
}
// ===== 月末請求 =====
$('mPrev').onclick=()=>shiftMonth(-1); $('mNext').onclick=()=>shiftMonth(1);
$('openInv').onclick=()=>{ if(!$('invMonth').value){ const d=new Date(); $('invMonth').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); } renderInv(); $('inv').hidden=false; };
$('invMonth').addEventListener('change',renderInv); $('invAll').addEventListener('change',renderInv);
function renderInv(){
  const ym=$('invMonth').value, all=$('invAll').checked;
  const targets=visible().filter(o=>o.status==='発送済' && !o.invoiceUrl && (all || !ym || !(o.shipDate||o.due) || String(o.shipDate||o.due).slice(0,7)===ym));
  const groups={}; targets.forEach(o=>{ (groups[o.customer]=groups[o.customer]||[]).push(o); });
  const keys=Object.keys(groups).sort();
  $('invList').innerHTML = keys.length ? keys.map(k=>{
    const list=groups[k]; const total=list.reduce((a,o)=>a+calcItems(o.items).total,0);
    const noPrice=list.some(o=>!calcItems(o.items).sub);
    return `<div class="inv-row"><div class="n"><b>${esc(k)}</b><span>${list.length}件：${list.map(o=>(o.shipDate||o.due)?fmt(o.shipDate||o.due):'<span style="color:var(--danger)">日付なし</span>').join('、')}${noPrice?'　<span style="color:var(--danger)">単価未入力あり</span>':''}</span></div><div class="amt">${yen(total)}</div><button class="next" style="--c:var(--s4)" data-inv="${esc(k)}" ${noPrice?'disabled':''}>作成</button></div>`;
  }).join('') : `<div class="empty">${all?'':(ym?ym.replace('-','年')+'月に発送した':'')}「発送済」で未請求の注文はありません</div>`;
  $('invList').querySelectorAll('[data-inv]').forEach(b=>b.onclick=async()=>{ b.disabled=true; b.textContent='作成中…'; const r=await makeInvoiceFor(groups[b.dataset.inv]); renderInv(); if(r&&r.url) window.open(r.url,'_blank'); });
}

// ===== 起動 =====
render(); (async()=>{ if(API_URL && !appKey) await ensureKey(); pull(); loadMaster(); })();
$('syncmsg').parentElement.onclick=()=>{ if(!appKey){ keyDeclined=false; ensureKey().then(ok=>{ if(ok){ pull(); loadMaster(); } }); } };
setInterval(pull, 60*1000);
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) pull(); });
</script>
</body>
</html>
